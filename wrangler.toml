name = "fuyugyo"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# D1 データベースバインディング（既存 DB をそのまま利用）
[[d1_databases]]
binding = "DB"
database_name = "fuyugyo"
database_id = "8a945c24-aea6-49f5-aca3-92dcd4203949"
migrations_dir = "drizzle"

# 静的アセット（Vite ビルド成果物の SPA）配信。/api/* のみ Worker を先に通す
[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# 環境変数（非機密情報のみ。JWT_SECRET / LINE_CHANNEL_SECRET は `wrangler secret` で管理）
[vars]
JWT_EXPIRES_IN = "12h"
INVITE_DEFAULT_EXPIRES = "168h"
# アプリのベース URL。LINE コールバック URL とログイン後リダイレクトの基点（本番値に差し替える）
APP_URL = "http://localhost:5173"
# LINE Login のチャネル ID（機密ではないため vars で管理。本番値に差し替える）
LINE_CHANNEL_ID = "0000000000"

# 認証系エンドポイント用の CF ネイティブ Rate Limiting バインディング（ADR 0004）。
# 未認証の攻撃面（login/callback/招待検証）のみに適用する。60 秒あたり 20 リクエストまで。
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "READ_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[observability]
enabled = true
head_sampling_rate = 1.0
