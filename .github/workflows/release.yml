name: Release

# 本番デプロイは手動実行のみ。main へのマージとデプロイを切り離し、
# 本番に出すタイミング（営業時間外など）を選べるようにする。
# 手順・ロールバック: docs/settings/database-migration-deployment.md
on:
  workflow_dispatch:

permissions:
  contents: read

# マイグレーションやデプロイの途中で止めると本番が中途半端な状態になるため、
# 後続の実行は待たせるだけで実行中のものは取り消さない
concurrency:
  group: deploy-production
  cancel-in-progress: false

# 失敗箇所をジョブ名で判別できるよう build → e2e → deploy に分ける。
# 3ジョブは build の成果物を受け渡し、E2E で検証したものと同じ成果物を本番に出す
jobs:
  build:
    runs-on: ubuntu-latest
    # 実行ブランチの選択に関わらず main 上の定義からのみ実行する
    if: github.repository == 'keichan110/fuyugyo' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
      create-release: ${{ steps.tag.outputs.create-release }}

    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      # 最新の公開 Release と同じコミットなら既存タグで再デプロイする。
      # 新しいコミットだけ JST の日付で vYYYY.MM.DD を採番し、同日2回目以降は .2, .3 ... を付ける。
      # concurrency で直列化しているため、採番からリリース作成までに他の実行と衝突しない。
      - name: Determine release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          latest_tag=$(gh release list --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts --exclude-pre-releases --limit 1 \
            --json tagName --jq '.[0].tagName // empty')
          if [ -n "$latest_tag" ]; then
            git fetch --no-tags origin "refs/tags/$latest_tag"
            latest_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
            if [ "$sha" = "$latest_sha" ]; then
              echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
              echo "create-release=false" >> "$GITHUB_OUTPUT"
              echo "Redeploying $latest_tag ($sha); no new GitHub Release."
              exit 0
            fi
          fi

          echo "create-release=true" >> "$GITHUB_OUTPUT"
          base="v$(TZ=Asia/Tokyo date +%Y.%m.%d)"
          existing=$(git ls-remote --tags --refs origin "refs/tags/${base}*" | sed 's|.*refs/tags/||')
          tag="$base"
          n=2
          while printf '%s\n' "$existing" | grep -qxF "$tag"; do
            tag="${base}.${n}"
            n=$((n + 1))
          done
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag ($(git rev-parse --short HEAD))"

      - name: Setup
        uses: ./.github/actions/setup

      # 設定漏れは時間のかかる E2E より前に検出する
      - name: Validate required secrets and variables
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_URL LINE_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
          if [ -n "$VITE_SENTRY_DSN" ]; then
            for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
              if [ -z "${!name}" ]; then
                echo "::error::$name is required when VITE_SENTRY_DSN is set"
                exit 1
              fi
            done
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      # Worker secret はデプロイごとに入れ直さない（secret put は新バージョンを即デプロイするため）。
      # Cloudflare 側に登録済みであることだけを確認する。
      - name: Verify Worker secrets exist
        run: |
          secrets=$(pnpm exec wrangler secret list --format json | jq -r '.[].name')
          for name in JWT_SECRET LINE_CHANNEL_SECRET; do
            if ! printf '%s\n' "$secrets" | grep -qxF "$name"; then
              echo "::error::Worker secret $name is not set on Cloudflare"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build application
        run: pnpm run build
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ steps.tag.outputs.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      # アップロード後の削除漏れがあればデプロイ前に停止する。
      - name: Verify source maps are not public
        run: |
          if find dist/client -name '*.map' -type f -print -quit | grep -q .; then
            echo "::error::Source maps remain in public assets"
            exit 1
          fi

      # wrangler deploy は .wrangler/deploy/config.json 経由で dist の設定を読むため、隠しディレクトリも含める
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      # 採番後に main が進んでも、採番したコミットを検証する
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-webkit

      # キャッシュがあってもOS依存は毎回導入する。ブラウザ本体は導入済みなら再取得しない。
      - name: Install Playwright browsers and system dependencies
        run: pnpm exec playwright install --with-deps chromium webkit

      # build ジョブの成果物をローカルWorker + 専用D1で検証する。
      # E2E失敗・キャンセル・timeout時は deploy ジョブを開始しない。
      - name: Run full E2E release gate
        run: pnpm run test:e2e:release

      - name: Upload failed E2E traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    # build と全件の E2E が成功したときだけ本番操作に進む（失敗・skip・キャンセルでは実行しない）
    if: needs.build.result == 'success' && needs.e2e.result == 'success'
    timeout-minutes: 10

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build

      # 新コードが参照するスキーマを先に用意し、デプロイ中の 500 を防ぐ。
      # 失敗した migration は Wrangler がロールバックする。適用済み migration の巻き戻しは
      # 自動では行われないため、DB の復元が必要な場合は D1 Time Travel を使う。
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply fuyugyo --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker Version にリリースタグを付け、Cloudflare 側のバージョンと GitHub Release を対応させる
      - name: Deploy to Cloudflare Workers
        run: |
          pnpm exec wrangler deploy \
            --var "APP_URL:$APP_URL" \
            --var "LINE_CHANNEL_ID:$LINE_CHANNEL_ID" \
            --var "SENTRY_RELEASE:$RELEASE_SHA" \
            --tag "$RELEASE_TAG" \
            --message "Release $RELEASE_TAG (${RELEASE_SHA:0:7})"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5

    steps:
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/api/health")
            if [ "$RESPONSE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $RESPONSE). Retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts."
          exit 1
        env:
          APP_URL: ${{ vars.APP_URL }}

  # 新しいコミットがあり、デプロイとヘルスチェックが両方成功した場合のみタグと Release を作る。
  # 失敗時にリリースだけが残り、記録と本番が食い違うのを避けるため最後に置く。
  # 書き込み権限はこのジョブだけに限定する。
  release:
    runs-on: ubuntu-latest
    needs: [build, deploy, health-check]
    if: needs.build.outputs.create-release == 'true'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ needs.build.outputs.sha }}
