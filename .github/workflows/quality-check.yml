name: Quality Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# PR では新しい push が来たら古い実行を止めて実行時間を節約する。
# main への push は全コミットの結果を残すため止めない
concurrency:
  group: quality-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 失敗箇所を PR のチェック欄で判別できるよう、性質ごとにジョブを分ける。
# セットアップの重複と分単位の課金の切り上げを抑えるため、これ以上は細かく分けない
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      # 静的チェックは互いに独立しているため、前段が落ちても後続を実行して結果を一度に出す
      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Run ESLint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run lint

      - name: Check Prettier formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run format:check

      # pnpm run build は typecheck を含み上で実行済みのため、バンドルだけを確かめる
      - name: Build application
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec vite build

      - name: Security audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm audit --audit-level=moderate --ignore-unfixable

  test:
    runs-on: ubuntu-latest
    # カバレッジの計装で Vitest の実行時間が倍程度に延びるため、15 分から余裕を持たせる
    timeout-minutes: 20
    outputs:
      coverage-report: ${{ steps.coverage-report.outputs.created }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      # テストを二重に回さないよう、通常のテストをカバレッジ計測付きで実行し、閾値未満なら失敗させる
      - name: Run tests with coverage
        run: pnpm run test:coverage

      # 閾値未満で失敗した場合も値を確認できるよう、レポートが出力されていれば常に書き出す
      - name: Build coverage report
        id: coverage-report
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        run: |
          node .github/scripts/coverage-report.mjs coverage/coverage-summary.json > coverage/report.md
          cat coverage/report.md >> "$GITHUB_STEP_SUMMARY"
          echo "created=true" >> "$GITHUB_OUTPUT"
        env:
          # PR では CI が main とのマージ結果を検証するため、利用者が識別できる head のコミットを載せる
          COVERAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload coverage report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.coverage-report.outputs.created == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage/report.md
          retention-days: 1

      # 開発用 seed は静的チェック・回帰テストの対象外のため、
      # import 解決やスキーマ変更で壊れていないかを空のローカル D1 への投入で確かめる
      - name: Verify local dev seed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm run db:migrate:local
          pnpm run db:seed:auth
          pnpm run db:seed:demo

  # 依存パッケージのコードを実行する test ジョブに書き込み権限を持たせないよう、投稿だけを別ジョブに分ける。
  # fork からの PR はトークンが読み取り専用で投稿できないため対象外にする
  coverage-comment:
    needs: test
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.test.outputs.coverage-report == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-report

      # PR ごとに 1 件のコメントを持ち、push のたびに最新の計測値で書き換えて最終値を記録として残す
      - name: Post or update coverage comment
        run: |
          marker='<!-- fuyugyo-coverage-report -->'
          comment_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" \
            | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -F body=@report.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@report.md > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E smoke tests
        run: pnpm run test:e2e:smoke

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
