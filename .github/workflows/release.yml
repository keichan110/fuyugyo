name: Release

# 本番デプロイは手動実行のみ。main へのマージとデプロイを切り離し、
# 本番に出すタイミング（営業時間外など）を選べるようにする。
# 手順・ロールバック: docs/settings/database-migration-deployment.md
on:
  workflow_dispatch:

permissions:
  contents: read

# マイグレーションやデプロイの途中で止めると本番が中途半端な状態になるため、
# 後続の実行は待たせるだけで実行中のものは取り消さない
concurrency:
  group: deploy-production
  cancel-in-progress: false

# ドラフト確認と品質チェックを済ませ、承認後に同じ成果物を本番へ出す。
jobs:
  prepare:
    runs-on: ubuntu-latest
    if: github.repository == 'keichan110/fuyugyo' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha }}
      id: ${{ steps.candidate.outputs.id }}
      draft: ${{ steps.candidate.outputs.draft }}
      url: ${{ steps.candidate.outputs.url }}
    steps:
      # 実行開始後に main が進んでも候補を変えない。
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'

      - name: Test release lifecycle
        run: node --test .github/scripts/release.test.mjs

      - name: Prepare release draft
        id: candidate
        run: node .github/scripts/release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}

  build:
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 10
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup
        uses: ./.github/actions/setup

      # 設定漏れは時間のかかる E2E より前に検出する
      - name: Validate required secrets and variables
        run: |
          for name in APP_URL LINE_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
          if [ -n "$VITE_SENTRY_DSN" ]; then
            for name in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT; do
              if [ -z "${!name}" ]; then
                echo "::error::$name is required when VITE_SENTRY_DSN is set"
                exit 1
              fi
            done
          fi
        env:
          APP_URL: ${{ vars.APP_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      - name: Build application
        run: pnpm run build
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ needs.prepare.outputs.sha }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}

      # アップロード後の削除漏れがあればデプロイ前に停止する。
      - name: Verify source maps are not public
        run: |
          if find dist/client -name '*.map' -type f -print -quit | grep -q .; then
            echo "::error::Source maps remain in public assets"
            exit 1
          fi

      # e2e ジョブのコンテナイメージを lockfile の Playwright と同じ版に揃えるため後続へ渡す
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # wrangler deploy は .wrangler/deploy/config.json 経由で dist の設定を読むため、隠しディレクトリも含める
      - name: Upload build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build
          overwrite: true
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ブラウザと OS 依存を同梱した公式イメージで実行し、毎回の導入時間を省く
  e2e:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.build.outputs.playwright-version }}-noble
      options: --user 1001

    steps:
      # 採番後に main が進んでも、採番したコミットを検証する
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build

      # build ジョブの成果物をローカルWorker + 専用D1で検証する。
      # E2E失敗・キャンセル・timeout時は deploy ジョブを開始しない。
      - name: Run full E2E release gate
        run: pnpm run test:e2e:release

      - name: Upload failed E2E traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: [prepare, build, e2e]
    # build と全件の E2E が成功したときだけ本番操作に進む（失敗・skip・キャンセルでは実行しない）
    if: needs.build.result == 'success' && needs.e2e.result == 'success'
    # Required reviewers の設定が必須。品質チェック後に確認・承認を待つ。
    environment:
      name: production
      url: ${{ needs.prepare.outputs.url }}
    permissions:
      contents: write
      actions: read
    timeout-minutes: 10

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-build

      - name: Verify approved release candidate
        run: node .github/scripts/release.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_DRAFT: ${{ needs.prepare.outputs.draft }}

      - name: Validate production credentials
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker secret はデプロイごとに入れ直さない（secret put は新バージョンを即デプロイするため）。
      # Cloudflare 側に登録済みであることだけを確認する。
      - name: Verify Worker secrets exist
        run: |
          secrets=$(pnpm exec wrangler secret list --format json | jq -r '.[].name')
          for name in JWT_SECRET LINE_CHANNEL_SECRET; do
            if ! printf '%s\n' "$secrets" | grep -qxF "$name"; then
              echo "::error::Worker secret $name is not set on Cloudflare"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 新コードが参照するスキーマを先に用意し、デプロイ中の 500 を防ぐ。
      # 失敗した migration は Wrangler がロールバックする。適用済み migration の巻き戻しは
      # 自動では行われないため、DB の復元が必要な場合は D1 Time Travel を使う。
      - name: Apply database migrations
        run: pnpm exec wrangler d1 migrations apply fuyugyo --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worker Version にリリースタグを付け、Cloudflare 側のバージョンと GitHub Release を対応させる
      - name: Deploy to Cloudflare Workers
        run: |
          pnpm exec wrangler deploy \
            --var "APP_URL:$APP_URL" \
            --var "LINE_CHANNEL_ID:$LINE_CHANNEL_ID" \
            --var "SENTRY_RELEASE:$RELEASE_SHA" \
            --tag "$RELEASE_TAG" \
            --message "Release $RELEASE_TAG (${RELEASE_SHA:0:7})"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_URL: ${{ vars.APP_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5

    steps:
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${APP_URL}/api/health")
            if [ "$RESPONSE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $RESPONSE). Retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts."
          exit 1
        env:
          APP_URL: ${{ vars.APP_URL }}

  # 公開失敗時はこのジョブだけ再実行できる。失敗した候補はドラフトのまま残す。
  release:
    runs-on: ubuntu-latest
    needs: [prepare, deploy, health-check]
    if: needs.prepare.outputs.draft == 'true'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'

      - name: Publish GitHub Release
        run: node .github/scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_DRAFT: ${{ needs.prepare.outputs.draft }}
