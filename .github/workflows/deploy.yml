name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'keichan110/fuyugyo'
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required secrets and variables
        run: |
          for name in JWT_SECRET LINE_CHANNEL_SECRET APP_URL LINE_CHANNEL_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}

      - name: Build application
        run: pnpm run build

      - name: Set Cloudflare secrets
        run: |
          pnpm exec wrangler secret put JWT_SECRET <<< "$JWT_SECRET"
          pnpm exec wrangler secret put LINE_CHANNEL_SECRET <<< "$LINE_CHANNEL_SECRET"
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          LINE_CHANNEL_SECRET: ${{ secrets.LINE_CHANNEL_SECRET }}

      # 新コードが参照するスキーマを先に用意し、デプロイ中の 500 を防ぐ。
      # Wrangler は migration ごとに D1 バックアップを取得し、失敗した migration をロールバックする。
      - name: Apply database migrations with D1 backup
        run: pnpm exec wrangler d1 migrations apply fuyugyo --remote

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler deploy --var "APP_URL:$APP_URL" --var "LINE_CHANNEL_ID:$LINE_CHANNEL_ID"
        env:
          APP_URL: ${{ vars.APP_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}

  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 5

    steps:
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.APP_URL }}/api/health")
            if [ "$RESPONSE" = "200" ]; then
              echo "Health check passed!"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $RESPONSE). Retrying in 5s..."
            sleep 5
          done
          echo "Health check failed after 10 attempts."
          exit 1
