name: Weekly Maintenance

on:
  schedule:
    # 月曜日 9:00（日本時間）。実際の開始時刻は GitHub 側の混雑により遅れる場合がある。
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    if: github.repository == 'keichan110/fuyugyo' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'

      # lockfile を直接監査し、依存解決やインストールによる変更を起こさない。
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  unreleased-changes:
    runs-on: ubuntu-latest
    if: github.repository == 'keichan110/fuyugyo' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.node-version'

      - name: Update unreleased changes issue
        run: node scripts/check-unreleased-changes.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
