name: Quality Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# PR では新しい push が来たら古い実行を止めて実行時間を節約する。
concurrency:
  group: quality-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 失敗箇所を PR のチェック欄で判別できるよう、性質ごとにジョブを分ける。
# セットアップの重複と分単位の課金の切り上げを抑えるため、これ以上は細かく分けない
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      # 静的チェックは互いに独立しているため、前段が落ちても後続を実行して結果を一度に出す
      - name: Run TypeScript type check
        run: pnpm run typecheck

      - name: Run ESLint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run lint

      - name: Check Prettier formatting
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run format:check

      # pnpm run build は typecheck を含み上で実行済みのため、バンドルだけを確かめる
      - name: Build application
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm exec vite build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Run tests
        run: |
          pnpm run test
          node --test scripts/check-unreleased-changes.test.mjs

      # 開発用 seed は静的チェック・回帰テストの対象外のため、
      # import 解決やスキーマ変更で壊れていないかを空のローカル D1 への投入で確かめる
      - name: Verify local dev seed
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: |
          pnpm run db:migrate:local
          pnpm run db:seed:auth
          pnpm run db:seed:demo

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup
        id: setup
        uses: ./.github/actions/setup

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run E2E smoke tests
        run: pnpm run test:e2e:smoke

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
